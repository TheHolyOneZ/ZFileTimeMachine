[package]
name = "zfiletimemachine"
version = "0.3.0"
description = "Automatic, private version history for any folder on your computer."
authors = ["TheHolyOneZ"]
license = "GPL-3.0-or-later"
homepage = "https://zsync.eu/zftm/"
repository = "https://github.com/TheHolyOneZ/ZFileTimeMachine"
readme = "../README.md"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zfiletimemachine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"

notify = "6"
notify-debouncer-full = "0.3"

rusqlite = { version = "0.31", features = ["bundled"] }

sha2 = "0.10"
hex = "0.4"

similar = { version = "2", features = ["text"] }

ignore = "0.4"

dashmap = "6"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "1"

directories = "5"

chrono = { version = "0.4", features = ["serde"] }

zstd = "0.13"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["tray-icon", "test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
